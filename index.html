<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Cupcakes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Loja de Cupcakes</h1>
    <p>Escolha seu cupcake favorito.</p>

    <div id="vitrine"></div>

    <h2>Carrinho</h2>

    <div id="itens-carrinho"></div>

    <p id="carrinho">Itens no carrinho: 0</p>
    <p id="total">Total: R$ 0,00</p>
    
    <button id="botao-esvaziar" onclick="esvaziarCarrinho()">
        Esvaziar Carrinho
    </button>
    
    <h2>Dados para entrega</h2>

    <form id="formulario-pedido">
        <p>
            <label for="cliente-nome">Nome:</label>
            <input
                id="cliente-nome"
                name="nome"
                type="text"
                autocomplete="name"
                maxlength="100"
                required
            >
        </p>

        <p>
            <label for="cliente-telefone">Telefone:</label>
            <input
                id="cliente-telefone"
                name="telefone"
                type="tel"
                autocomplete="tel"
                maxlength="20"
                required
            >
        </p>

        <p>
            <label for="cliente-endereco">Endereço completo:</label>
            <textarea
                id="cliente-endereco"
                name="endereco"
                autocomplete="street-address"
                rows="3"
                maxlength="300"
                placeholder="Rua, número, complemento, bairro, cidade e CEP"
                required
            ></textarea>
        </p>

        <p>Projeto acadêmico: pagamento simulado, sem cobrança real.</p>

        <button id="botao-finalizador" type="submit">
            Revisar pedido
        </button>
    </form>

    <p id="mensagem-pedido" role="status"></p>
    <script src="script.js"></script>
</body>
</html>
